{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "eventail.fullname" . }}
  labels:
    {{- include "eventail.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $component, $url := dict "web" $.Values.webUrl "api" $.Values.apiUrl }}
    - host: {{ lower (urlParse $url).hostname }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "eventail.fullname" $ }}-{{ $component }}
                port:
                  name: http
    {{- end }}
{{- end }}
