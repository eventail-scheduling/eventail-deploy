name: Bump

on:
  # Sent by a release workflow once its unit's images are published.
  repository_dispatch:
    types: [image-released]
  workflow_dispatch:
    inputs:
      component:
        description: eventail or furry-schedule-adapter
        required: true
        type: choice
        options: [eventail, furry-schedule-adapter]
      version:
        description: The released version, without a v
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.client_payload.component || inputs.component }}-${{ github.event.client_payload.version || inputs.version }}

jobs:
  bump:
    runs-on: ubuntu-latest
    # The App's token does the writing, so this job's own token needs nothing.
    permissions: {}
    steps:
      # Pushes and pull requests made with GITHUB_TOKEN start no workflow runs,
      # so the checks auto-merge waits for would never run.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.repository.default_branch }}
      - uses: ./.github/actions/setup
      - run: node scripts/bump.ts
        env:
          COMPONENT: ${{ github.event.client_payload.component || inputs.component }}
          VERSION: ${{ github.event.client_payload.version || inputs.version }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
