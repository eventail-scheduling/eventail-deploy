name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    # The App's token does the writing, so this job's own token needs nothing.
    permissions: {}
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      prs: ${{ steps.release.outputs.prs }}
    steps:
      # Pushes and pull requests made with GITHUB_TOKEN start no workflow runs,
      # so checks would never run on the release pull request.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  auto-merge-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.prs != '' && needs.release-please.outputs.prs != '[]' }}
    runs-on: ubuntu-latest
    permissions: {}
    strategy:
      matrix:
        pull_request: ${{ fromJSON(needs.release-please.outputs.prs) }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: ./.github/actions/setup
      - run: node scripts/auto-merge-release.ts
        env:
          PR_NUMBER: ${{ matrix.pull_request.number }}
          PR_TITLE: ${{ matrix.pull_request.title }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  publish-chart:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        chart: ${{ fromJSON(needs.release-please.outputs.paths_released) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # One matrix leg packages one chart into an empty RUNNER_TEMP, so the
      # glob below has exactly one file to find.
      - run: helm package "${{ matrix.chart }}" --destination "$RUNNER_TEMP/chart"
      - run: helm push "$RUNNER_TEMP"/chart/*.tgz oci://ghcr.io/eventail-scheduling/charts
