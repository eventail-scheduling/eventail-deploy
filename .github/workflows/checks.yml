name: Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: helm lint --strict charts/eventail -f ci/values.yaml

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - run: helm template eventail charts/eventail -f ci/values.yaml > "$RUNNER_TEMP/rendered.yaml"
      - run: >-
          docker run --rm -i
          ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e
          -strict -summary - < "$RUNNER_TEMP/rendered.yaml"

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - working-directory: compose
        env:
          POSTGRES_PASSWORD: eventail
        run: |
          cp .env.example .env
          cp api.env.example api.env
          cp web.env.example web.env
          docker compose config --quiet

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Start the services the chart expects
        run: |
          kubectl apply -f ci/dependencies.yaml
          kubectl wait --for=condition=Available deployment --all --timeout=5m

      - run: helm install eventail charts/eventail -f ci/values.yaml --wait --timeout 5m

      - name: Check that nothing restarted
        run: |
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=eventail --timeout=1m
          restarts=$(kubectl get pods -l app.kubernetes.io/instance=eventail \
            -o jsonpath='{range .items[*]}{.status.containerStatuses[*].restartCount}{"\n"}{end}' | sort -u)
          test "$restarts" = 0
          kubectl logs deployment/eventail-worker | grep -q "Worker started"

      - name: Show the cluster state
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods
          kubectl logs -l 'app in (postgres,oidc,s3)' --prefix --ignore-errors --tail=100
          kubectl logs -l app.kubernetes.io/instance=eventail --all-containers --prefix --ignore-errors --tail=100
          kubectl logs -l app.kubernetes.io/instance=eventail --all-containers --prefix --ignore-errors --tail=100 --previous
