name: eventail

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: eventail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: eventail
    healthcheck:
      # -h forces TCP; during initdb the temporary server only listens on the
      # unix socket and would pass a socket-based check too early.
      test: ["CMD-SHELL", "pg_isready -U eventail -h 127.0.0.1"]
      interval: 5s
      retries: 20
      start_period: 10s

  api:
    image: ghcr.io/eventail-scheduling/eventail-api:0.0.0
    restart: unless-stopped
    # Docker's default 10 seconds would cut off the built-in worker: the api spends up
    # to 5 seconds closing connections, then drains running jobs for up to 15 by default
    # (WORKER_RUNTIME_DRAIN_TIMEOUT).
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    env_file: api.env
    environment:
      PORT: 3000
      POSTGRES_HOSTNAME: postgres
      POSTGRES_USERNAME: eventail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DATABASE: eventail
      CORS_ORIGIN: ${WEB_URL:?set WEB_URL in .env}
      FRONTEND_BASE_URL: ${WEB_URL:?set WEB_URL in .env}
    ports:
      - 127.0.0.1:${API_PORT:-3000}:3000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      retries: 6
      start_period: 30s

  web:
    image: ghcr.io/eventail-scheduling/eventail-web:0.0.0
    restart: unless-stopped
    env_file: web.env
    environment:
      API_URL: ${API_URL:?set API_URL in .env}
    ports:
      - 127.0.0.1:${WEB_PORT:-8080}:8080
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/runtime-env.js"]
      interval: 10s
      retries: 6
      start_period: 5s

  furry-schedule-adapter:
    # Opt in with `--profile furry-schedule-adapter`; most deployments do not
    # publish to the Furry Schedule Schema.
    profiles: [furry-schedule-adapter]
    image: ghcr.io/eventail-scheduling/eventail-furry-schedule-adapter:0.1.0
    restart: unless-stopped
    env_file: furry-schedule-adapter.env
    environment:
      # Fixed by this file rather than left to the env file: both are
      # determined by the compose topology, and editing the cache path to
      # somewhere off the volume silently writes the token onto the container
      # layer, which is the loss the volume exists to prevent.
      EVENTAIL_BASE_URL: http://api:3000
      EVENTAIL_AUTH_TOKEN_CACHE_PATH: /var/cache/adapter/token.json
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 127.0.0.1:${FURRY_SCHEDULE_ADAPTER_PORT:-8081}:3000
    volumes:
      - furry-schedule-adapter-cache:/var/cache/adapter
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      retries: 6
      start_period: 5s

volumes:
  postgres-data:
  furry-schedule-adapter-cache:
