# Rendered on top of eventail-furry-schedule-adapter-values.yaml to cover both
# routers, including the overlap an operator sees while migrating.
hostnames:
  - schedule.eventail.test

ingress:
  enabled: true
  className: nginx
  tls:
    - secretName: schedule-tls
      hosts:
        - schedule.eventail.test

httpRoute:
  enabled: true
  parentRefs:
    - name: public
      namespace: gateways
