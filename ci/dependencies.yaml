apiVersion: v1
kind: Secret
metadata:
  name: postgres
stringData:
  password: eventail
---
apiVersion: v1
kind: Secret
metadata:
  name: s3
stringData:
  accessKeyId: eventail
  secretAccessKey: eventail-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - name: POSTGRES_USER
              value: eventail
            - name: POSTGRES_PASSWORD
              value: eventail
            - name: POSTGRES_DB
              value: eventail
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "eventail", "-h", "127.0.0.1"]
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oidc
spec:
  selector:
    matchLabels:
      app: oidc
  template:
    metadata:
      labels:
        app: oidc
    spec:
      containers:
        - name: oidc
          image: ghcr.io/navikt/mock-oauth2-server:6.0.1
          env:
            - name: SERVER_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /default/.well-known/openid-configuration
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: oidc
spec:
  selector:
    app: oidc
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
spec:
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      containers:
        - name: rustfs
          image: rustfs/rustfs:1.0.0-rc.2
          env:
            - name: RUSTFS_VOLUMES
              value: /data
            - name: RUSTFS_ADDRESS
              value: ":9000"
            - name: RUSTFS_ACCESS_KEY
              value: eventail
            - name: RUSTFS_SECRET_KEY
              value: eventail-secret
          readinessProbe:
            tcpSocket:
              port: 9000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: s3
spec:
  selector:
    app: s3
  ports:
    - port: 9000
